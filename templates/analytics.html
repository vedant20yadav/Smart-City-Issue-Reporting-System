<!DOCTYPE html>
<html>
<head>
    <title>Analytics Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="container">
    <h2 class="text-center mb-3">Analytics Dashboard</h2>

    <div class="text-center mb-4">
        <a href="/" class="btn btn-outline-secondary me-2">Home</a>
        <a href="/admin" class="btn btn-outline-primary">Admin</a>
    </div>

    <h4 class="text-center">Issues by Category</h4>
    <div class="chart-container">
        <canvas id="categoryChart"></canvas>
    </div>

    <h4 class="text-center">Issues by Priority</h4>
    <div class="chart-container">
        <canvas id="priorityChart"></canvas>
    </div>
</div>

<script>
    new Chart(document.getElementById('categoryChart'), {
        type: 'bar',
        data: {
            labels: {{ categories | safe }},
            datasets: [{
                label: 'Issues',
                data: {{ category_counts | safe }},
                backgroundColor: 'rgba(13,110,253,0.7)'
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });

    new Chart(document.getElementById('priorityChart'), {
        type: 'pie',
        data: {
            labels: {{ priorities | safe }},
            datasets: [{
                data: {{ priority_counts | safe }},
                backgroundColor: [
                    'rgba(220,53,69,0.7)',
                    'rgba(255,193,7,0.7)',
                    'rgba(25,135,84,0.7)'
                ]
            }]
        },
        options: { responsive: true, maintainAspectRatio: false }
    });
</script>

</body>
</html>
